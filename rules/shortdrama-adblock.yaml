payload:
  # ==============================================================================
  # 1. 阻断 QUIC (UDP 443) 与字节跳动私有长连接广告推送端口
  # ==============================================================================
  - AND,((NETWORK,udp),(DST-PORT,443))
  - DST-PORT,8658
  - DST-PORT,8900
  - DST-PORT,9681

  # ==============================================================================
  # 2. 阻断内置 HTTPDNS、无 SNI 加密私有通道与 IPv6 HTTPDNS
  # ==============================================================================
  - DOMAIN-REGEX,^tnc[0-9]*-.*\.(zijieapi|snssdk|toutiaoapi|bytedance|amemv)\.com(\..*)?$
  - DOMAIN-REGEX,^([a-z0-9.-]+\.)?dig\.bdurl\.net(\..*)?$
  - DOMAIN-SUFFIX,httpdns.volcengineapi.com
  - IP-CIDR,101.36.166.0/24,no-resolve
  - IP-CIDR,113.142.25.50/32,no-resolve
  - IP-CIDR,8.134.241.67/32,no-resolve
  - IP-CIDR6,240e:978:d04:2002::/64,no-resolve

  # ==============================================================================
  # 3. 拦截红果短剧 / 抖音短剧 / 番茄小说核心广告下发与激励变现接口
  # ==============================================================================
  - DOMAIN-REGEX,^ads[0-9]*-normal.*\.(zijieapi|snssdk|fqnovel|amemv)\.com(\..*)?$
  - DOMAIN-REGEX,^polaris[0-9]*-.*\.(zijieapi|snssdk|fqnovel|amemv)\.com(\..*)?$
  - DOMAIN-REGEX,^([a-z0-9.-]+\.)?(pglstatp-toutiao|pangolin-sdk-toutiao|pangolin-sdk-toutiao-b|pangolin|pangle|ctobsnssdk|bytedance-ads|bytead)\.(com|cn|net)(\..*)?$
  - DOMAIN-REGEX,^.*(pangolin|pglstatp|bytead|ad-sign|ads-normal).*\.com(\..*)?$

  # ==============================================================================
  # 4. 拦截抖音短剧小游戏试玩广告 (Ohayoo / mgsdk) 与买量热更新资源包
  # ==============================================================================
  - DOMAIN-SUFFIX,dailygn.com
  - DOMAIN-KEYWORD,mgsdk
  - DOMAIN-SUFFIX,hbttl.cn
  - DOMAIN-KEYWORD,down-update
  - DOMAIN-KEYWORD,leads-fe
  - DOMAIN-SUFFIX,ecomuser.snssdk.com
  - DOMAIN-SUFFIX,byteurl.cn
  - DOMAIN-REGEX,^klink[0-9]*-.*\.(amemv|zijieapi|snssdk|fqnovel)\.com(\..*)?$

  # ==============================================================================
  # 5. 拦截短剧内嵌第三方买量落地页、微短剧推广与外链 APK 源
  # ==============================================================================
  - DOMAIN-SUFFIX,quminglemei.com
  - DOMAIN-SUFFIX,daztoutiao.cn
  - DOMAIN-SUFFIX,zttapk.bscgslb.com
  - DOMAIN-SUFFIX,yingt.fun
  - DOMAIN-SUFFIX,qiezibenpao.com
  - DOMAIN-SUFFIX,tianwenca.com
  - DOMAIN-SUFFIX,app-analytics-services.com

  # ==============================================================================
  # 6. 拦截广告曝光计费回传、应用日志与性能遥测上报
  # ==============================================================================
  - DOMAIN-REGEX,^(rt)?log[0-9]*-.*\.(amemv|zijieapi|snssdk|fqnovel|bytedance)\.com(\..*)?$
  - DOMAIN-REGEX,^logbk\.(amemv|zijieapi|snssdk|fqnovel)\.com(\..*)?$
  - DOMAIN-REGEX,^.*mon.*\.(zijieapi|snssdk|fqnovel|amemv)\.com(\..*)?$
  - DOMAIN-REGEX,^saveu[0-9]*-.*\.(amemv|zijieapi|snssdk|fqnovel)\.com(\..*)?$
  - DOMAIN-KEYWORD,aweme-saveu
  - DOMAIN-SUFFIX,toutiaocloud.com
  - DOMAIN-SUFFIX,toutiaocloud.net
  - DOMAIN-SUFFIX,live-player-log-service.bytedance.com
